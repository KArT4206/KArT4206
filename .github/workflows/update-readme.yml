name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_readme.py", ".github/workflows/update-readme.yml"]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild project list
        run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          # ignore runs where only the "last run" timestamp moved
          if [ -z "$(git diff -U0 README.md | grep '^[+-][^+-]' | grep -v 'last run')" ]; then
            git checkout README.md; echo "No project changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh project list"
          git pull --rebase
          git push
